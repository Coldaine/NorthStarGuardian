name: Guardian Debt Sweep

on:
  schedule:
    # Run daily at 12:00 UTC.
    - cron: "0 12 * * *"
  # Allow manual trigger for testing.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sweep-debt:
    name: Sweep Debt Timers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NorthStarGuardian
        run: pip install -e ".[dev]"

      - name: Configure git identity for memory commits
        run: |
          git config user.name "NorthStarGuardian"
          git config user.email "guardian@github-actions.bot"

      - name: Run debt sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: guardian sweep-debt
