name: Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  interview:
    name: PR Interview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NorthStarGuardian
        run: pip install -e ".[dev]"

      - name: Configure git identity for memory commits
        run: |
          git config user.name "NorthStarGuardian"
          git config user.email "guardian@github-actions.bot"

      - name: Run Guardian interview
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: guardian interview --event-path "$GITHUB_EVENT_PATH"

  command:
    name: Slash Command
    if: >-
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NorthStarGuardian
        run: pip install -e ".[dev]"

      - name: Configure git identity for memory commits
        run: |
          git config user.name "NorthStarGuardian"
          git config user.email "guardian@github-actions.bot"

      - name: Dispatch slash command
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: guardian command --event-path "$GITHUB_EVENT_PATH"
